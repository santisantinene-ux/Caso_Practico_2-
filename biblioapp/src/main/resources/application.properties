spring.application.name=biblioapp

# DB: local por defecto, variables de entorno en deploy
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioappdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Puerto: variable PORT en deploy, 8080 en local
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false

# JWT: el secreto va por variable de entorno (min 32 caracteres)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

