<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Prestamos')}"></head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="${soloMios} ? 'Mis prestamos' : 'Prestamos'">Prestamos</h1>
        <a sec:authorize="hasRole('BIBLIOTECARIO')" href="/prestamos/nuevo" class="btn btn-primary">
            Registrar prestamo
        </a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- seccion prestamos atrasados (solo para bibliotecario) -->
    <div sec:authorize="hasRole('BIBLIOTECARIO')" th:if="${!soloMios and atrasados != null and !atrasados.isEmpty()}"
         class="card border-danger mb-4">
        <div class="card-header bg-danger text-white">
            Prestamos atrasados (<span th:text="${atrasados.size()}">0</span>)
        </div>
        <div class="card-body">
            <table class="table table-sm mb-0">
                <thead>
                <tr><th>Libro</th><th>Usuario</th><th>Fecha limite</th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${atrasados}" class="table-danger">
                    <td th:text="${p.libro.titulo}">Libro</td>
                    <td th:text="${p.usuario.nombreCompleto}">Usuario</td>
                    <td th:text="${#temporals.format(p.fechaLimite, 'dd/MM/yyyy')}">Fecha</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${prestamos == null or prestamos.isEmpty()}" class="alert alert-info">
        No hay prestamos para mostrar.
    </div>

    <table th:if="${prestamos != null and !prestamos.isEmpty()}" class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Libro</th>
            <th>Usuario</th>
            <th>Prestado</th>
            <th>Fecha limite</th>
            <th>Estado</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${prestamos}">
            <td th:text="${p.libro.titulo}">Titulo del libro</td>
            <td th:text="${p.usuario.nombreCompleto}">Usuario</td>
            <td th:text="${#temporals.format(p.fechaPrestamo, 'dd/MM/yyyy')}">Fecha</td>
            <td th:text="${#temporals.format(p.fechaLimite, 'dd/MM/yyyy')}">Fecha</td>
            <td>
                <span th:if="${p.devuelto}" class="badge bg-success">
                    Devuelto <span th:text="${#temporals.format(p.fechaDevolucion, 'dd/MM/yyyy')}"></span>
                </span>
                <span th:unless="${p.devuelto}" class="badge bg-warning text-dark">Pendiente</span>
            </td>
            <td>
                <form sec:authorize="hasRole('BIBLIOTECARIO')" th:if="${!p.devuelto}"
                      th:action="@{'/prestamos/' + ${p.id} + '/devolver'}" method="post">
                    <button type="submit" class="btn btn-outline-success btn-sm">Devolver</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
