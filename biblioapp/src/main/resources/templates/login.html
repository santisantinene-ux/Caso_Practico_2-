<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Ingresar')}"></head>
<body>
<div class="container" style="max-width: 420px; margin-top: 80px;">
    <h2 class="mb-4">Ingresar a BiblioApp</h2>
    <div th:if="${param.error}" class="alert alert-danger">Usuario o contrasena incorrectos.</div>
    <div th:if="${param.logout}" class="alert alert-success">Sesion cerrada correctamente.</div>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contrasena</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
    <p class="mt-3 mb-1"><a href="/forgot">Olvide mi contrasena</a></p>
    <p class="text-muted small">Ver credenciales de ejemplo en el README del proyecto.</p>
</div>
</body>
</html>
