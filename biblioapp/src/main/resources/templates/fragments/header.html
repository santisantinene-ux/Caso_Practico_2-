<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - BiblioApp'">BiblioApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/libros">BiblioApp</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/libros">Catalogo</a>
            <a class="nav-link" href="/ranking" sec:authorize="isAuthenticated()">Ranking</a>
            <a class="nav-link" href="/prestamos" sec:authorize="hasRole('BIBLIOTECARIO')">Prestamos</a>
            <a class="nav-link" href="/usuarios" sec:authorize="hasRole('BIBLIOTECARIO')">Usuarios</a>
            <a class="nav-link" href="/prestamos/mios" sec:authorize="hasRole('LECTOR')">Mis prestamos</a>
            <span class="nav-link text-white-50" sec:authorize="isAuthenticated()"
                  th:text="${'Sesion: ' + #authentication.name}">Sesion</span>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="d-inline">
                <button type="submit" class="btn btn-link nav-link">Salir</button>
            </form>
            <a class="nav-link" href="/login" sec:authorize="!isAuthenticated()">Ingresar</a>
        </div>
    </div>
</nav>
</body>
</html>
