<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Recuperar contrasena')}"></head>
<body>
<div class="container" style="max-width: 420px; margin-top: 80px;">
    <h2 class="mb-4">Recuperar contrasena</h2>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <p class="text-muted">Ingresa tu correo y te enviaremos un enlace para elegir una nueva contrasena.</p>

    <form th:action="@{/forgot}" method="post">
        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>
    </form>
    <p class="mt-3"><a href="/login">Volver a ingresar</a></p>
</div>
</body>
</html>
